name: iOS Build IPA

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  SCHEME: GBALinkEmulator
  PROJECT: GBALinkEmulator/GBALinkEmulator.xcodeproj
  CONFIGURATION: Release
  DERIVED_DATA: ${{ github.workspace }}/DerivedData

jobs:
  build:
    name: Build IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true
          xcodebuild -version

      - name: Debug project structure
        run: |
          pwd
          ls -la
          find . -maxdepth 4 -name "*.xcodeproj"
          find . -maxdepth 4 -name "*.xcworkspace"

      - name: Show schemes
        run: |
          xcodebuild -list -project "$PROJECT"

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -derivedDataPath "$DERIVED_DATA"

      - name: Build app
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "$DERIVED_DATA/Build/Products/Release-iphoneos" -name "*.app" -maxdepth 1 | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "No .app found"
            find "$DERIVED_DATA/Build/Products" -maxdepth 4 -type d
            exit 1
          fi

          cp -R "$APP_PATH" Payload/
          zip -r GBALinkEmulator.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GBALinkEmulator-IPA
          path: GBALinkEmulator.ipa
