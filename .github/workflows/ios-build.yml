name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    defaults:
      run:
        working-directory: GBALinkEmulator

    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: |
          xcodebuild \
            -project GBALinkEmulator.xcodeproj \
            -scheme GBALinkEmulator \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r GBALinkEmulator.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GBALinkEmulator-IPA
          path: GBALinkEmulator/GBALinkEmulator.ipa
