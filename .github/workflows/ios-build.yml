name: iOS Build & Archive

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  SCHEME:        GBALinkEmulator
  PROJECT:       GBALinkEmulator/GBALinkEmulator.xcodeproj
  CONFIGURATION: Release
  PLATFORM:      "generic/platform=iOS"
  DERIVED_DATA:  ${{ github.workspace }}/DerivedData

jobs:
  build:
    name: Build (compile check)
    runs-on: macos-14
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Install xcpretty
        run: gem install xcpretty --no-document 2>/dev/null || true

      - name: Verify project structure
        run: |
          echo "=== Project file ==="
          ls -la "$PROJECT"
          echo "=== project.pbxproj ==="
          ls -la "$PROJECT/project.pbxproj"
          echo "=== Source files ==="
          find GBALinkEmulator/GBALinkEmulator -type f | sort

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project       "$PROJECT" \
            -scheme        "$SCHEME"  \
            -configuration "$CONFIGURATION" \
            -destination   "$PLATFORM" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
          2>&1 | xcpretty --color --simple
