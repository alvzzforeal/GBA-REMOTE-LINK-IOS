name: iOS Build & Archive

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  SCHEME:        GBALinkEmulator
  PROJECT:       GBALinkEmulator/GBALinkEmulator.xcodeproj
  CONFIGURATION: Release
  PLATFORM:      "generic/platform=iOS"
  DERIVED_DATA:  ${{ github.workspace }}/DerivedData

jobs:
  build:
    name: Build (compile check)
    runs-on: macos-14
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          ls /Applications/ | grep Xcode || true
          if [ -d /Applications/Xcode_15.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d /Applications/Xcode_15.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer
          elif [ -d /Applications/Xcode_15.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          else
            echo "Using default Xcode"
          fi
          xcodebuild -version

      - name: Install xcpretty
        run: gem install xcpretty --no-document 2>/dev/null || true

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Show project structure
        run: |
          find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -20
          echo "---"
          ls -la

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme  "$SCHEME"  \
            -derivedDataPath "$DERIVED_DATA"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme  "$SCHEME"  \
            -configuration "$CONFIGURATION" \
            -destination   "$PLATFORM" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
          2>&1 | xcpretty --color --simple

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme  "$SCHEME"  \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
          2>&1 | xcpretty --color --simple
        continue-on-error: true
