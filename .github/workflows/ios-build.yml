name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  SCHEME: GBALinkEmulator
  PROJECT: GBALinkEmulator/GBALinkEmulator.xcodeproj
  CONFIGURATION: Release
  DERIVED_DATA: ${{ github.workspace }}/DerivedData

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true
          xcodebuild -version

      - name: Verify project
        run: |
          ls -la
          find . -name "*.xcodeproj"
          find . -name "project.pbxproj"

      - name: Build
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "$DERIVED_DATA/Build/Products/Release-iphoneos" -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "No .app found"
            exit 1
          fi

          cp -R "$APP_PATH" Payload/
          zip -r GBALinkEmulator.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GBALinkEmulator-IPA
          path: GBALinkEmulator.ipa
