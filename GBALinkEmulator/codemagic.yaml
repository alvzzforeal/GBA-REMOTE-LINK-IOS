workflows:
  ios-build:
    name: GBALinkEmulator iOS Build
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set Xcode version
        script: |
          xcode-select -p
      - name: Build iOS app (no signing)
        script: |
          xcodebuild \
            -project GBALinkEmulator.xcodeproj \
            -scheme GBALinkEmulator \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath $CM_BUILD_DIR/GBALinkEmulator.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive | xcpretty
    artifacts:
      - $CM_BUILD_DIR/GBALinkEmulator.xcarchive

  ios-release:
    name: GBALinkEmulator iOS Release (App Store)
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.guizinho.GBALinkEmulator
    scripts:
      - name: Build and archive
        script: |
          xcodebuild \
            -project GBALinkEmulator.xcodeproj \
            -scheme GBALinkEmulator \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath $CM_BUILD_DIR/GBALinkEmulator.xcarchive \
            archive | xcpretty
      - name: Export IPA
        script: |
          xcodebuild \
            -exportArchive \
            -archivePath $CM_BUILD_DIR/GBALinkEmulator.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $CM_BUILD_DIR/ipa
    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
      - $CM_BUILD_DIR/GBALinkEmulator.xcarchive
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
